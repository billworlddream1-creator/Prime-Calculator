name: Build, Artifacts & Release V1.0.1

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Platform Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Native Projects
        run: npx cap sync

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare Platform Bundles
        run: |
          mkdir -p release-artifacts

          # Copy Android APK
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/prime-calculator-v1.0.1.apk

          # Package Web static dist
          zip -r release-artifacts/prime-calculator-web-v1.0.1.zip dist/

          # Package Windows Web Bundle
          zip -r release-artifacts/prime-calculator-windows-web-v1.0.1.zip dist/

          # Package macOS Web Bundle
          zip -r release-artifacts/prime-calculator-macos-web-v1.0.1.zip dist/

          # Package iOS Capacitor Web Bundle
          zip -r release-artifacts/prime-calculator-ios-web-v1.0.1.zip ios/

      - name: Calculate & Output File Sizes
        run: |
          echo "### 📦 Build Artifact File Sizes" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | File Name | Size (Bytes) | Human Readable |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          for file in release-artifacts/*; do
            filename=$(basename "$file")
            size_bytes=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
            size_human=$(ls -lh "$file" | awk '{print $5}')
            echo "| ${filename} | \`${filename}\` | ${size_bytes} | ${size_human} |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-v1.0.1
          path: release-artifacts/prime-calculator-v1.0.1.apk
          retention-days: 90

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-v1.0.1
          path: release-artifacts/prime-calculator-web-v1.0.1.zip
          retention-days: 90

      - name: Upload Windows App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-v1.0.1
          path: release-artifacts/prime-calculator-windows-web-v1.0.1.zip
          retention-days: 90

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-v1.0.1
          path: release-artifacts/prime-calculator-macos-web-v1.0.1.zip
          retention-days: 90

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-v1.0.1
          path: release-artifacts/prime-calculator-ios-web-v1.0.1.zip
          retention-days: 90

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Prime Calculator Cross-Platform Release

            Full binary packages and platform distribution bundles for version ${{ github.ref_name }}.

            ### File Sizes & Binaries
            - `prime-calculator-v1.0.1.apk` - Android Debug APK Package
            - `prime-calculator-windows-web-v1.0.1.zip` - Windows Desktop Web Bundle
            - `prime-calculator-macos-web-v1.0.1.zip` - macOS Desktop Web Bundle
            - `prime-calculator-ios-web-v1.0.1.zip` - iOS Capacitor Native Bundle
            - `prime-calculator-web-v1.0.1.zip` - Universal Static Web Bundle
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
