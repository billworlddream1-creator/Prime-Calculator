name: Build, Artifacts & Release V1.0.1

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          npm run build
          npx cap copy android
          cd android
          ./gradlew assembleDebug

      - name: Check Android APK binary file size
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -h "$APK_PATH" | cut -f1)
            BYTES=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
            echo "Android APK Size: $SIZE ($BYTES bytes)"
            echo "ANDROID_APK_SIZE=$SIZE" >> $GITHUB_ENV
            echo "ANDROID_APK_BYTES=$BYTES" >> $GITHUB_ENV
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-v1.0.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-web-windows-macos-ios:
    name: Build Web, Windows, macOS, iOS bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Application & Capacitor Assets
        run: npm run build

      - name: Prepare bundle zips for platforms (Web, Windows, macOS, iOS)
        run: |
          mkdir -p release-builds
          zip -r release-builds/prime-calculator-web-v1.0.1.zip dist/
          zip -r release-builds/prime-calculator-windows-web-v1.0.1.zip dist/
          zip -r release-builds/prime-calculator-macos-web-v1.0.1.zip dist/
          zip -r release-builds/prime-calculator-ios-web-v1.0.1.zip dist/

      - name: Display full binary download file sizes
        run: |
          echo "### Binary Download File Sizes" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | File | Size | Bytes |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          for file in release-builds/*; do
            SIZE=$(du -h "$file" | cut -f1)
            BYTES=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
            FILENAME=$(basename "$file")
            echo "| Multi-platform bundle | $FILENAME | $SIZE | $BYTES bytes |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-v1.0.1
          path: release-builds/prime-calculator-web-v1.0.1.zip

      - name: Upload Windows Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-v1.0.1
          path: release-builds/prime-calculator-windows-web-v1.0.1.zip

      - name: Upload macOS Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-v1.0.1
          path: release-builds/prime-calculator-macos-web-v1.0.1.zip

      - name: Upload iOS Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-v1.0.1
          path: release-builds/prime-calculator-ios-web-v1.0.1.zip

  release-v1-0-1:
    name: Create V1.0.1 GitHub Release
    needs: [build-android, build-web-windows-macos-ios]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk-v1.0.1
          path: release-assets/android/

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-v1.0.1
          path: release-assets/web/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-app-v1.0.1
          path: release-assets/windows/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-app-v1.0.1
          path: release-assets/macos/

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-app-v1.0.1
          path: release-assets/ios/

      - name: Organize assets & Calculate binary file sizes
        run: |
          mkdir -p release-files
          cp release-assets/android/app-debug.apk release-files/prime-calculator-v1.0.1.apk
          cp release-assets/web/prime-calculator-web-v1.0.1.zip release-files/
          cp release-assets/windows/prime-calculator-windows-web-v1.0.1.zip release-files/
          cp release-assets/macos/prime-calculator-macos-web-v1.0.1.zip release-files/
          cp release-assets/ios/prime-calculator-ios-web-v1.0.1.zip release-files/

          echo "## Release V1.0.1 - Binary Download File Sizes" > release_notes.md
          echo "" >> release_notes.md
          echo "| Platform / Asset | File Name | File Size | Exact Bytes |" >> release_notes.md
          echo "| --- | --- | --- | --- |" >> release_notes.md
          for file in release-files/*; do
            SIZE=$(du -h "$file" | cut -f1)
            BYTES=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
            FNAME=$(basename "$file")
            echo "| Binary Download | $FNAME | $SIZE | $BYTES bytes |" >> release_notes.md
          done
          echo "" >> release_notes.md
          echo "### Supported Platforms:" >> release_notes.md
          echo "- **Android**: Installable APK file (`prime-calculator-v1.0.1.apk`)" >> release_notes.md
          echo "- **Windows**: Web application package for Windows desktop/browsers" >> release_notes.md
          echo "- **macOS**: Web application package for macOS desktop/browsers" >> release_notes.md
          echo "- **iOS**: iOS web/Capacitor application bundle" >> release_notes.md
          echo "- **Web**: Universal web static dist archive" >> release_notes.md

      - name: Create or Update GitHub Release V1.0.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Release V1.0.1 - Prime Calculator"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
